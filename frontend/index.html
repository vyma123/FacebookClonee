<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/frontend/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <title>Facebook</title>
</head>
<body>
    <section class="login-container">
        <div class="login">

        <div class="login-logo-box">
            <div class="logo-box">
                <img class="logo" src="images/logo.png" alt="Facebook logo">
            </div>

            <div class="login-text-box">
                <h1 class="login-heading-primary">Khám phá những điều <span class="login-heading-primary-sp">bạn yêu <br>thích</span>.</h1>
            </div>
        </div>

        <div class="login-img-box">
            <img src="images/log_header_image.webp" class="login-img" alt="Branding">
        </div>


        
        <div class="login-form">
            <div class="login-form-box">
                <span class="login-text">Đăng nhập vào Facebook</span>
            <form class="login-form-content">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            </div>
        </div>

        </div>
    </section>
    <footer>Footer</footer>
</body>
</html>
